<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>about me</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <section id="about" class="about container">
            <h2 style="text-align: center; margin-bottom: 2rem;">About Me</h2>
            <div class="about-content">
                <div class="about-text">
                    <p>Hello, I am Hossein, a computer science student and backend developer.</p>
                    <br>
                    <p>My goal is to create online businesses and I am interested in learning specialized skills.</p>
                </div>
                <div class="about-image">
                    <img src="hossein.jpg" alt="profile">
                </div>
            </div>
        </section>
         <section id="skills" class="skills container">
            <h2 style="text-align: center; margin-bottom: 2rem;">My Skills</h2>
            <div class="skills-grid">
                <div class="skill-card">
                    <h3>HTML5 & CSS3</h3>
                    <div class="skill-bar"><div class="skill-progress" data-width="90"></div></div>
                </div>
                <div class="skill-card">
                    <h3>JavaScript</h3>
                    <div class="skill-bar"><div class="skill-progress" data-width="85"></div></div>
                </div>
                <div class="skill-card">
                    <h3>Python && OOP</h3>
                    <div class="skill-bar"><div class="skill-progress" data-width="80"></div></div>
                </div>
                <div class="skill-card">
                    <h3>Git</h3>
                    <div class="skill-bar"><div class="skill-progress" data-width="75"></div></div>
                </div>
            </div>
        </section>
        <a href="index.html">Home</a>
</body>
</html>
